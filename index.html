<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zino 10M</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #18212f;
      --muted: #64748b;
      --primary: #6448ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f5f7fb);
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .loader {
      width: min(100%, 560px);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 55px rgba(100, 72, 255, 0.12);
      text-align: center;
    }
    .badge {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), #2dd4bf);
      color: white;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="badge">Z</div>
    <h1>جاري تحميل Zino 10M...</h1>
    <p>يتم تحميل الصفحة الرئيسية من الملف الأساسي في المشروع.</p>
  </div>

  <script>
    fetch('./const%20firebaseConfig')
      .then(async (response) => {
        if (!response.ok) throw new Error('Missing main HTML file');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      })
      .catch((error) => {
        const loader = document.getElementById('loader');
        loader.innerHTML = `
          <div class="badge">!</div>
          <h1>تعذر تحميل التطبيق</h1>
          <p>الملف الرئيسي غير موجود أو غير قابل للوصول.<br>يرجى التأكد من وجود ملف <strong>const firebaseConfig</strong> في الجذر.</p>
        `;
        console.error(error);
      });
  </script>
</body>
</html>
